name: ibkr-mcp-stack

# ─────────────────────────────────────────────────────────────────
#  Architecture
#
#  Internet (HTTPS)
#    │
#    ▼
#  Caddy (TLS, Routing, Auth)
#    ├── /mcp*   → Anthropic IPs (Claude.ai) OR Bearer Token
#    │              → ibkr-mcp-server:8000
#    └── /mcpo*  → Bearer Token → mcpo:8001 → ibkr-mcp-server:8000
#                  (Open-WebUI via OpenAPI)
#
#  Switch Paper ↔ Live: change only the .env file!
#    TRADING_MODE=paper  + IB_GATEWAY_PORT=4004
#    TRADING_MODE=live   + IB_GATEWAY_PORT=4003
# ─────────────────────────────────────────────────────────────────

services:

  # ── 1. IB Gateway (TWS headless) ─────────────────────────────
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: always
    environment:
      TWS_USERID:                  ${TWS_USERID}
      TWS_PASSWORD:                ${TWS_PASSWORD}
      TRADING_MODE:                ${TRADING_MODE}
      READ_ONLY_API:               ${READ_ONLY_API}
      TWS_ACCEPT_INCOMING:         accept
      BYPASS_WARNING:              yes
      TWOFA_TIMEOUT_ACTION:        ${TWOFA_TIMEOUT_ACTION}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT}
      AUTO_RESTART_TIME:           ${AUTO_RESTART_TIME}
      TIME_ZONE:                   ${TIME_ZONE}
      VNC_SERVER_PASSWORD:         ${VNC_SERVER_PASSWORD}
    ports:
      # VNC local only – for debugging purposes
      - "127.0.0.1:5900:5900"
    volumes:
      - ib-gateway-settings:/home/ibgateway/Jts
    networks:
      - ibkr-internal
    healthcheck:
      # 0x0FA3 = 4003 (live port), 0x0FA4 = 4004 (paper port)
      test: ["CMD-SHELL", "grep -q '0FA4\\|0FA3' /proc/net/tcp"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ── 2. IBKR MCP Server ────────────────────────────────────────
  ibkr-mcp-server:
    build: ./ibkr-trading          # custom image (hellek1 + trading extension)
    restart: always
    # CLI arguments override internal image defaults.
    # IB_GATEWAY_PORT comes from .env:
    #   Paper → 4004  |  Live → 4003
    command:
      - "--host"
      - "ib-gateway"
      - "--port"
      - "${IB_GATEWAY_PORT}"
      - "--client-id"
      - "1"
      - "--transport"
      - "http"
      - "--http-host"
      - "0.0.0.0"
      - "--http-port"
      - "8000"
    environment:
      TRADING_ENABLED: ${TRADING_ENABLED:-false}
    networks:
      - ibkr-internal
    depends_on:
      ib-gateway:
        condition: service_healthy
    healthcheck:
      # 0x1F40 = port 8000
      test: ["CMD-SHELL", "grep -q '1F40' /proc/net/tcp6 || grep -q '1F40' /proc/net/tcp"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── 3. MCPO (MCP → OpenAPI proxy for Open-WebUI) ─────────────
  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    restart: always
    command:
      - "--port"
      - "8001"
      - "--api-key"
      - "${MCP_SECRET_TOKEN}"
      - "--config"
      - "/app/config.json"
    volumes:
      - ./mcpo/config.json:/app/config.json:ro
    networks:
      - ibkr-internal
    depends_on:
      ibkr-mcp-server:
        condition: service_healthy
    healthcheck:
      # 0x1F41 = port 8001
      test: ["CMD-SHELL", "grep -q '1F41' /proc/net/tcp6 || grep -q '1F41' /proc/net/tcp"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── 4. Caddy (TLS, routing, authentication) ───────────────────
  caddy:
    image: caddy:2-alpine
    restart: always
    # IMPORTANT: entrypoint replaces __DOMAIN__ in the Caddyfile template
    # via sed before Caddy starts. Caddy does not reliably resolve {env.DOMAIN}
    # in site block labels – sed is 100% reliable.
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s/__DOMAIN__/$${DOMAIN}/g" /etc/caddy/Caddyfile.tmpl \
          > /tmp/Caddyfile && \
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"           # HTTP/3 (QUIC)
    environment:
      DOMAIN:           ${DOMAIN}
      MCP_SECRET_TOKEN: ${MCP_SECRET_TOKEN}
    volumes:
      # Mount Caddyfile as template (entrypoint generates final version)
      - ./Caddyfile:/etc/caddy/Caddyfile.tmpl:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - ibkr-internal
    depends_on:
      mcpo:
        condition: service_healthy
      ibkr-mcp-server:
        condition: service_healthy

# ── Volumes ───────────────────────────────────────────────────────
volumes:
  ib-gateway-settings:
  caddy-data:
  caddy-config:

# ── Networks ──────────────────────────────────────────────────────
networks:
  ibkr-internal:
    driver: bridge
